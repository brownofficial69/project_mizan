[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mizan"
version = "0.2.0"
description = "Safety-margin gate and interior-point barrier: a concept demonstration with an HTTP API"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "CC0-1.0" }
dependencies = ["numpy>=1.24"]

[project.optional-dependencies]
api = ["fastapi>=0.110", "uvicorn[standard]>=0.29"]
model = ["torch>=2.1", "transformers>=4.40"]
dev = ["pytest>=8", "httpx>=0.27", "fastapi>=0.110", "uvicorn[standard]>=0.29"]

[tool.setuptools]
packages = ["mizan"]
py-modules = ["mizan_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
